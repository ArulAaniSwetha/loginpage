<!DOCTYPE html>
<html>
<head>
    <title>Home Page</title>

    <style>
        body{
            background-image: url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            margin: 0;
            text-align: center;
        }

        .navbar{
            background-color: rgba(255, 255, 255, 0.8);
            padding: 15px;
            text-align: left;
        }

        .navbar a{
            text-decoration: none;
            color: #333;
            background-color: #a8d8ea;
            padding: 10px 15px;
            border-radius: 8px;
            margin: 0px;
        }

        .navbar a:hover{
            background-color: #88c9e8;
        }

        .container{
            background-color: rgba(255, 255, 255, 0.8);
            width: 60%;
            margin: 100px auto;
            padding: 30px;
            border-radius: 15px;
        }

        h1{
            color: #4a6fa5;
        }

        p{
            color: #555;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

    <div class="container">
        <h1>Welcome to My Website</h1>
        <p>This is my first homepage.</p>
    </div>

</body>
</html>
