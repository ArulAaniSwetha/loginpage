<html>
    <head>
        <center>
            <h1>Application form</h1>
        </center>
    </head>
    <style>
        body{
            background-color: aquamarine;
            text-align: center;
            font-family: Verdana;
            font-size: 30px;
            border-style: solid;
        }
input{
        border: 2px solid black;   
        padding: 5px 10px;        
        display: inline-block;     
        margin: 5px;
        width: 250px;
        justify-content: center;
        align-items: center;
    }
    button{
    border: none;
    border-radius: 20px; 
    padding: 10px 20px;
    font-size: 18px;
    margin-top: 20px; 
}
label{
    align-items: center;
    justify-content: center;
}
    </style>
    <center>
    <form>
        <label for="fname">first name:</label>
        <input type="text" name="fname"><br>
        <label for="lname">last name:</label>
        <input type="text" name="lname"><br>
        <label for="faname">father name:</label>
        <input type="text" name="faname"><br>
        <label for="maname">mother name:</label>
        <input type="text" name="maname"><br>
        <label for="age">age: </label>
    <input type="number" name="age"><br>
    <label for="dob">date of birth:</label>(dd-mm-yyyy)
    <input type="number" name="dob"><br>
    <label for="tmarks">total marks:</label>
    <input type="number" name="tmarks"><br>
    <button>submit</button>

</form>
</center>
</html>
